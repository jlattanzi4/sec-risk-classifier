[project]
name = "sec-risk-copying"
version = "0.1.0"
description = "How much of a 10-K risk section is boilerplate, and what makes companies rewrite?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The old modeling code is left alone until milestone 5 removes it.
extend-exclude = ["src", "notebooks"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
