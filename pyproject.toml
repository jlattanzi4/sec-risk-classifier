[project]
name = "sec-risk-copying"
version = "0.1.0"
description = "How much of a 10-K risk section is boilerplate, and what makes companies rewrite?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "model2vec>=0.10.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The old modeling code is left alone until milestone 5 removes it.
extend-exclude = ["src", "notebooks"]

[tool.ruff.lint]
# Long word lists read better as one split string than as a list of quoted words.
extend-ignore = ["SIM905"]

[dependency-groups]
dev = [
    "pysbd>=0.3.4",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
